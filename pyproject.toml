[project]
name = "equitylens"
version = "0.5.0"
description = "Evidence and financial data foundation for Indian and US company research"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2,<3",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "pypdf>=5,<7",
  "beautifulsoup4>=4.12,<5", "streamlit>=1.66,<2", "altair>=6,<7", "pandas>=2.2,<4",
  "langgraph>=1,<2", "mcp>=2,<3",
  "fastembed>=0.9,<1", "httpcore>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]
