name: Verify EquityLens

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/evaluate_retrieval.py --mode bm25 --min-all-relevant-at-5 0.8
      - run: python scripts/evaluate_retrieval.py --dataset evaluation/filing_pilot_2025.json --mode bm25 --min-all-relevant-at-5 1.0
